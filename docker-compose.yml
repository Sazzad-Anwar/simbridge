# SIMBridge — local infrastructure
# Usage: docker compose up -d
services:
  mongo:
    image: mongo:8
    container_name: simbridge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional web UI for inspecting the local database (http://localhost:8081)
  mongo-express:
    image: mongo-express:1
    container_name: simbridge-mongo-ui
    restart: unless-stopped
    profiles: ["ui"]
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
