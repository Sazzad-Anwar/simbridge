name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [release]
    tags:
      - 'v*.*.*'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Ensure debug keystore
        working-directory: apps/mobile/android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Collect APK
        run: |
          mkdir -p artifacts

          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            artifacts/SIMBridge.apk

          test -f artifacts/SIMBridge.apk

          echo "APK:"
          ls -lh artifacts/SIMBridge.apk

      - name: Generate SHA-256
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sha256sum artifacts/SIMBridge.apk \
            > artifacts/SIMBridge.apk.sha256

          cat artifacts/SIMBridge.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SIMBridge
          path: artifacts/SIMBridge.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: SIMBridge ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            artifacts/SIMBridge.apk
            artifacts/SIMBridge.apk.sha256
